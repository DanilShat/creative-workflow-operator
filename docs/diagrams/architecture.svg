<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">Creative Workflow operator architecture</title>
  <desc id="desc">Designer browser talks to Streamlit, Streamlit talks to FastAPI, FastAPI stores data in Postgres and queues jobs for worker laptops.</desc>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.accent{fill:#ecfeff;stroke:#0891b2}.data{fill:#fefce8;stroke:#ca8a04}.text{font:600 16px Arial, sans-serif;fill:#0f172a}.small{font:13px Arial, sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="280"/>
  <rect class="box accent" x="40" y="70" width="150" height="90"/>
  <text class="text" x="65" y="110">Designer</text><text class="small" x="67" y="132">browser UI</text>
  <rect class="box" x="250" y="70" width="150" height="90"/>
  <text class="text" x="290" y="110">Streamlit</text><text class="small" x="282" y="132">operator app</text>
  <rect class="box" x="460" y="70" width="150" height="90"/>
  <text class="text" x="505" y="110">FastAPI</text><text class="small" x="493" y="132">control plane</text>
  <rect class="box data" x="680" y="30" width="150" height="70"/>
  <text class="text" x="718" y="70">Postgres</text>
  <rect class="box data" x="680" y="150" width="150" height="70"/>
  <text class="text" x="710" y="190">Artifacts</text>
  <rect class="box accent" x="870" y="70" width="80" height="90"/>
  <text class="text" x="888" y="110">Worker</text><text class="small" x="881" y="132">poll/claim</text>
  <line class="arrow" x1="190" y1="115" x2="250" y2="115"/>
  <line class="arrow" x1="400" y1="115" x2="460" y2="115"/>
  <line class="arrow" x1="610" y1="95" x2="680" y2="65"/>
  <line class="arrow" x1="610" y1="135" x2="680" y2="185"/>
  <line class="arrow" x1="830" y1="115" x2="870" y2="115"/>
</svg>
