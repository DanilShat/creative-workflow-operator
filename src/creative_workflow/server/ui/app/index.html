<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Creative Workflow — Operator Console</title>
<style>
/* =========================== design tokens ============================ */
:root {
  --bg: #0d0e12; --bg-2: #14161d; --bg-3: #1b1e27; --bg-hover: #20242f;
  --border: #282b36; --border-soft: #20222c;
  --text: #e7e8ec; --text-dim: #969aa6; --text-faint: #6b6f7c;
  --accent: #6d8bff; --accent-soft: rgba(109,139,255,.15);
  --amber: #e5a13a; --blue: #5b9bd5; --green: #43b888; --red: #e0594f; --gray: #6b7280;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
  --radius: 14px; --radius-sm: 9px;
}
body.light {
  --bg: #f4f5f7; --bg-2: #ffffff; --bg-3: #fbfbfc; --bg-hover: #eef0f3;
  --border: #e2e4e9; --border-soft: #ecedf1;
  --text: #1c1f27; --text-dim: #5d626e; --text-faint: #9097a3;
  --accent-soft: rgba(109,139,255,.13);
  --shadow: 0 6px 22px rgba(20,24,40,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

#root { display: flex; height: 100vh; }

/* ================================ sidebar ============================= */
.sidebar {
  width: 280px; flex-shrink: 0; background: var(--bg-2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 100vh;
}
.sb-head { padding: 16px 14px 8px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark {
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #9a6dff);
}
.brand .name { font-weight: 650; font-size: 14px; letter-spacing: .2px; }
.brand .sub { font-size: 11px; color: var(--text-faint); }
.new-chat-btn {
  margin: 10px 14px 6px; padding: 10px 12px;
  background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius-sm); font-weight: 600; font-size: 13.5px;
  display: flex; align-items: center; gap: 8px; justify-content: center;
  transition: background .12s;
}
.new-chat-btn:hover { background: #5d7cf5; }
.chats-scroll {
  flex: 1; overflow-y: auto; padding: 6px 8px 6px;
}
.chat-item {
  position: relative; padding: 9px 12px; border-radius: var(--radius-sm);
  cursor: pointer; margin-bottom: 2px;
  display: flex; flex-direction: column; gap: 2px;
  transition: background .1s;
}
.chat-item:hover { background: var(--bg-hover); }
.chat-item.active { background: var(--bg-3); border-left: 3px solid var(--accent); padding-left: 9px; }
.chat-item.hidden-row { opacity: .55; }
.chat-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.chat-title { font-weight: 600; font-size: 13.3px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-time { font-size: 10.5px; color: var(--text-faint); flex-shrink: 0; }
.chat-preview { font-size: 12px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-icon-btn {
  position: absolute; right: 6px; top: 6px;
  width: 22px; height: 22px; border-radius: 6px;
  background: transparent; border: none; color: var(--text-faint);
  display: none; align-items: center; justify-content: center; font-size: 13px;
}
.chat-item:hover .chat-icon-btn { display: inline-flex; }
.chat-icon-btn:hover { background: var(--border); color: var(--text); }

.sb-divider { margin: 6px 14px; border-top: 1px solid var(--border-soft); }
.sb-toggle-row {
  padding: 6px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 12px; color: var(--text-dim);
}
.sb-toggle-row:hover { color: var(--text); }
.sb-toggle-row .chev { font-size: 10px; opacity: .7; }

.sb-foot {
  padding: 10px 14px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px; font-size: 12px;
}
.sys-row { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--gray); }
.dot.green { background: var(--green); } .dot.red { background: var(--red); }
.dot.amber { background: var(--amber); }
.theme-btn {
  margin-top: 4px; background: transparent; color: var(--text-faint);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 5px; font-size: 11px;
}
.theme-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ================================ main thread ========================= */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.thread-head {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; min-height: 56px;
}
.thread-head .title { font-weight: 650; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-head .actions { margin-left: auto; display: flex; gap: 6px; }
.head-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 7px; padding: 6px 10px; font-size: 12px;
}
.head-btn:hover { background: var(--bg-hover); color: var(--text); }

.thread-body {
  flex: 1; overflow-y: auto; padding: 28px 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
  scroll-behavior: smooth;
}
.thread-inner { max-width: 820px; width: 100%; margin: 0 auto;
  display: flex; flex-direction: column; gap: 14px; }

/* bubbles */
.bubble {
  padding: 11px 14px; border-radius: 14px;
  font-size: 13.8px; line-height: 1.55; white-space: pre-wrap;
  max-width: 80%; word-wrap: break-word;
}
.row { display: flex; gap: 8px; }
.row.user { justify-content: flex-end; }
.row.agent { justify-content: flex-start; }
.row.system { justify-content: center; }
.bubble.user { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.bubble.agent { background: var(--bg-2); border: 1px solid var(--border);
  border-bottom-left-radius: 4px; }
.bubble.system { background: transparent; color: var(--text-faint);
  font-size: 12px; font-style: italic; max-width: 100%; text-align: center; }

.bubble-images { margin-top: 10px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.bubble-images img { width: 100%; aspect-ratio: 4/5; object-fit: cover;
  border-radius: 8px; border: 2px solid transparent; cursor: pointer; background: var(--bg-3); }
.bubble-images img:hover { border-color: var(--border); }
.bubble-images img.sel { border-color: var(--accent); }
.bubble-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.b-btn {
  padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--bg-3); color: var(--text); font-size: 12.5px; font-weight: 550;
}
.b-btn:hover { background: var(--bg-hover); }
.b-btn:disabled { opacity: .5; cursor: not-allowed; }
.b-btn.approve { background: var(--green); border-color: var(--green); color: #04231a; }
.b-btn.approve:hover { filter: brightness(1.08); }
.b-btn.reject { color: var(--red); border-color: rgba(224,89,79,.45); background: transparent; }
.b-btn.reject:hover { background: rgba(224,89,79,.12); }

.bubble-status { margin-top: 8px; font-size: 11.5px; color: var(--text-faint);
  display: flex; align-items: center; gap: 6px; }
.bubble-status .pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--amber);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(229,161,58,.4); } 50% { box-shadow: 0 0 0 7px rgba(229,161,58,0); } }

.reject-form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.reject-form textarea {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  resize: vertical; min-height: 60px;
}
.reject-form textarea:focus { outline: none; border-color: var(--accent); }

.fail-card { margin-top: 8px; padding: 8px 12px; border-radius: 7px;
  background: rgba(224,89,79,.12); border: 1px solid rgba(224,89,79,.35);
  color: #f0a39c; font-size: 12.5px; }

.bubble-attachments { display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px;
  margin-bottom: 8px; }
.bubble-attachments img { width: 100%; aspect-ratio: 1/1; object-fit: cover;
  border-radius: 6px; background: var(--bg-3); }

/* composer */
.composer {
  border-top: 1px solid var(--border); padding: 14px 24px 18px; background: var(--bg);
}
.composer-inner { max-width: 820px; margin: 0 auto; }
.attached-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.attached-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 4px 4px 8px; font-size: 12px;
}
.attached-chip img { width: 32px; height: 32px; object-fit: cover; border-radius: 5px; }
.attached-chip .x { width: 20px; height: 20px; display: inline-flex; align-items: center;
  justify-content: center; border-radius: 4px; color: var(--text-faint); cursor: pointer; }
.attached-chip .x:hover { background: var(--border); color: var(--text); }

.composer-box {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 8px 8px 12px; display: flex; align-items: flex-end; gap: 6px;
  transition: border-color .12s, background .12s;
}
.composer-box.dragover { border-color: var(--accent); background: var(--accent-soft); }
.composer-box textarea {
  flex: 1; background: transparent; color: var(--text);
  border: none; outline: none; resize: none; font-family: inherit;
  font-size: 14px; padding: 6px 0 6px; min-height: 24px; max-height: 200px;
  line-height: 1.5;
}
.icon-btn {
  width: 34px; height: 34px; border-radius: 8px;
  background: transparent; border: none; color: var(--text-dim);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 17px;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.send-btn {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--accent); border: none; color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.send-btn:hover { background: #5d7cf5; }
.send-btn:disabled { opacity: .4; cursor: not-allowed; background: var(--accent); }

.composer-help {
  font-size: 11px; color: var(--text-faint); margin-top: 7px; text-align: center;
}

/* gallery strip — small thumbs at top of thread */
.gallery-strip {
  display: flex; gap: 8px; padding: 6px 0 14px;
  border-bottom: 1px solid var(--border-soft); margin-bottom: 18px;
  overflow-x: auto;
}
.gallery-strip img { height: 64px; width: auto; border-radius: 6px;
  cursor: pointer; background: var(--bg-3); flex-shrink: 0; }
.gallery-strip img:hover { outline: 2px solid var(--accent); }

/* empty / loading / error states */
.center-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; color: var(--text-dim); gap: 14px;
  padding: 40px;
}
.center-state .big { font-size: 38px; }
.center-state .head { font-size: 18px; font-weight: 600; color: var(--text); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* toasts */
#toasts { position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 9px; z-index: 99; }
.toast {
  padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px;
  box-shadow: var(--shadow); background: var(--bg-3);
  border: 1px solid var(--border); max-width: 340px;
}
.toast.err { border-color: rgba(224,89,79,.45); color: #f0a39c; }
.toast.ok { border-color: rgba(67,184,136,.45); color: #8fdab9; }
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 30px;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   Creative Workflow Operator Console — chat-first SPA
   Vanilla JS, single file, served same-origin by the operator at /app/.
   ========================================================================= */

/* ------------------------------ helpers ---------------------------------- */
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
    for (const kid of kids) {
      if (kid === null || kid === undefined || kid === false) continue;
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

function timeAgo(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s/60) + "m";
  if (s < 86400) return Math.floor(s/3600) + "h";
  if (s < 604800) return Math.floor(s/86400) + "d";
  return new Date(iso).toLocaleDateString();
}
function assetUrl(id) { return "/api/v1/assets/" + id + "/download"; }
function toast(msg, kind) {
  const t = h("div", { class: "toast " + (kind || "") }, msg);
  document.getElementById("toasts").append(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 4200);
  setTimeout(() => t.remove(), 4600);
}

/* ------------------------------- API ------------------------------------- */
async function apiErr(r) {
  let detail;
  try { detail = await r.json(); } catch { detail = null; }
  let m = r.statusText;
  if (detail) {
    if (detail.detail) m = detail.detail.message || (typeof detail.detail === "string" ? detail.detail : m);
    else if (detail.error) m = detail.error.message || m;
  }
  const e = new Error(typeof m === "string" ? m : JSON.stringify(m));
  e.status = r.status;
  return e;
}
const API = {
  async get(p)  { const r = await fetch("/api/v1" + p); if (!r.ok) throw await apiErr(r); return r.json(); },
  async post(p, body) {
    const r = await fetch("/api/v1" + p, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw await apiErr(r);
    return r.json();
  },
  async patch(p, body) {
    const r = await fetch("/api/v1" + p, {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw await apiErr(r);
    return r.json();
  },
  async postForm(p, fd) {
    const r = await fetch("/api/v1" + p, { method: "POST", body: fd });
    if (!r.ok) throw await apiErr(r);
    return r.json();
  },
};

/* ----------------------------- app state -------------------------------- */
const ACTIVE_STATES = ["waiting_worker", "running_worker_job", "retry_requested"];

const app = {
  conversations: [],     // visible (not hidden) summaries
  hiddenConvs: [],       // hidden summaries (lazy-loaded)
  showHidden: false,
  activeId: null,        // null = new chat (no conv created yet)
  detail: null,          // currently loaded ConversationDetailResponse
  health: null,
  workers: [],
  composer: { text: "", files: [] },
  rejecting: null,       // { runId: string, reason: string } when reject form open
  sending: false,
  lightbox: null,        // asset_id of currently-lightboxed image
};
let pollTimer = null;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function startPoll(fn, ms) { stopPoll(); pollTimer = setInterval(fn, ms); }

/* ------------------------------ routing --------------------------------- */
function parseRoute() {
  const raw = (location.hash || "#/").replace(/^#/, "");
  if (raw.startsWith("/conv/")) return { name: "conv", id: raw.slice(6) };
  return { name: "home" };
}
function navigate(hash) { location.hash = hash; }

/* ========================== SIDEBAR ====================================== */
function renderSidebar() {
  const r = parseRoute();
  const activeId = r.name === "conv" ? r.id : (app.activeId || null);
  const onlineWorkers = (app.workers || []).filter(w => {
    if (!w.last_heartbeat_at) return false;
    return (Date.now() - new Date(w.last_heartbeat_at).getTime()) < 60000;
  }).length;
  const healthOk = app.health && app.health.ok;

  const sidebar = h("aside", { class: "sidebar" });
  sidebar.append(
    h("div", { class: "sb-head" },
      h("div", { class: "brand" },
        h("div", { class: "mark" }),
        h("div", {},
          h("div", { class: "name" }, "Creative Workflow"),
          h("div", { class: "sub" }, "Operator Console")))),
    h("button", { class: "new-chat-btn", onclick: startNewChat },
      h("span", {}, "✚"), h("span", {}, "New chat")));

  const list = h("div", { class: "chats-scroll" });

  if (!app.conversations.length && !app.showHidden) {
    list.append(h("div", { style: { padding: "16px 12px", color: "var(--text-faint)", fontSize: "12px" } },
      "No chats yet. Click ✚ New chat to start one."));
  }
  for (const c of app.conversations) {
    list.append(renderChatItem(c, activeId, false));
  }

  // hidden section
  const hiddenCount = app.hiddenConvs.length;
  if (hiddenCount > 0 || app.showHidden) {
    list.append(h("div", { class: "sb-divider" }));
    list.append(h("div", {
      class: "sb-toggle-row",
      onclick: toggleShowHidden,
    },
      h("span", { class: "chev" }, app.showHidden ? "▾" : "▸"),
      h("span", {}, app.showHidden ? "Hide hidden" : `Show hidden (${hiddenCount})`)));
    if (app.showHidden) {
      if (!hiddenCount) {
        list.append(h("div", { style: { padding: "8px 12px", color: "var(--text-faint)", fontSize: "12px" } },
          "No hidden chats."));
      }
      for (const c of app.hiddenConvs) {
        list.append(renderChatItem(c, activeId, true));
      }
    }
  }

  sidebar.append(list);

  sidebar.append(h("div", { class: "sb-foot" },
    h("div", { class: "sys-row" },
      h("span", { class: "dot " + (healthOk ? "green" : "red") }),
      healthOk ? "Operator online" : "Operator unreachable"),
    h("div", { class: "sys-row" },
      h("span", { class: "dot " + (onlineWorkers ? "green" : "amber") }),
      `${onlineWorkers} worker${onlineWorkers === 1 ? "" : "s"} online`),
    h("button", { class: "theme-btn", onclick: toggleTheme }, "Toggle theme")));

  return sidebar;
}

function renderChatItem(c, activeId, isHidden) {
  const item = h("div", {
    class: "chat-item" + (c.conversation_id === activeId ? " active" : "") + (isHidden ? " hidden-row" : ""),
    onclick: e => {
      if (e.target.closest(".chat-icon-btn")) return;
      navigate("/conv/" + c.conversation_id);
    },
  });
  item.append(
    h("div", { class: "chat-title-row" },
      h("span", { class: "chat-title" }, c.title || "Untitled"),
      h("span", { class: "chat-time" }, timeAgo(c.last_message_at || c.updated_at))));
  if (c.last_message_preview) {
    item.append(h("div", { class: "chat-preview" }, c.last_message_preview));
  }
  const btn = h("button", {
    class: "chat-icon-btn",
    title: isHidden ? "Restore" : "Hide",
    onclick: e => {
      e.stopPropagation();
      if (isHidden) restoreChat(c.conversation_id);
      else hideChat(c.conversation_id);
    },
  }, isHidden ? "↺" : "×");
  item.append(btn);
  return item;
}

function toggleTheme() {
  document.body.classList.toggle("light");
  try { localStorage.setItem("cw_theme", document.body.classList.contains("light") ? "light" : "dark"); } catch {}
}
function toggleShowHidden() {
  app.showHidden = !app.showHidden;
  if (app.showHidden && !app.hiddenConvs.length) loadHiddenList();
  render();
}

/* ========================== MAIN AREA ==================================== */
function renderMain() {
  const r = parseRoute();
  const main = h("main", { class: "main" });

  if (r.name === "home" && !app.activeId) {
    main.append(renderHomeEmpty());
    return main;
  }
  if (r.name === "conv" && !app.detail) {
    main.append(renderLoading());
    return main;
  }
  main.append(renderHeader());
  main.append(renderThreadBody());
  main.append(renderComposer());
  return main;
}

function renderHomeEmpty() {
  return h("div", { class: "center-state" },
    h("div", { class: "big" }, "💬"),
    h("div", { class: "head" }, "Start a conversation"),
    h("div", {}, "Describe what you want, or drop an image to start a Gate A run."),
    h("button", { class: "new-chat-btn", style: { margin: "10px 0 0" }, onclick: startNewChat },
      h("span", {}, "✚"), h("span", {}, "New chat")));
}

function renderLoading() {
  return h("div", { class: "center-state" }, h("div", { class: "spinner" }));
}

function renderHeader() {
  const newChat = !app.activeId;
  const title = newChat ? "New chat" : (app.detail?.conversation?.title || "Untitled");
  return h("header", { class: "thread-head" },
    h("div", { class: "title" }, title),
    !newChat && h("div", { class: "actions" },
      h("button", { class: "head-btn", title: "Rename", onclick: renameActive }, "Rename"),
      h("button", { class: "head-btn", title: "Hide chat", onclick: hideActive }, "Hide")));
}

function renderThreadBody() {
  const body = h("div", { class: "thread-body" });
  const inner = h("div", { class: "thread-inner" });
  body.append(inner);

  if (!app.activeId) {
    // brand-new local chat — empty state inside the thread
    inner.append(h("div", { class: "center-state", style: { padding: "30px 10px" } },
      h("div", { class: "big" }, "✦"),
      h("div", { class: "head" }, "What should we make?"),
      h("div", {}, "Drop a reference image and tell me what you want.")));
    return body;
  }

  const detail = app.detail;
  if (!detail) { body.append(h("div", { class: "spinner" })); return body; }

  // gallery strip at top if there are generated images
  if (detail.gallery && detail.gallery.length) {
    const strip = h("div", { class: "gallery-strip", title: "Images generated in this chat" });
    for (const a of detail.gallery) {
      strip.append(h("img", {
        src: assetUrl(a.asset_id), alt: "",
        onclick: () => { app.lightbox = a.asset_id; render(); },
      }));
    }
    inner.append(strip);
  }

  // messages
  const taskById = {};
  for (const t of (detail.tasks || [])) taskById[t.task_id] = t;
  const latestAgentMsgByTask = {};
  for (const m of detail.messages) {
    if (m.role === "agent" && m.related_task_id) latestAgentMsgByTask[m.related_task_id] = m.message_id;
  }

  for (const m of detail.messages) {
    if (m.role === "user" && !m.content.trim() && (!m.attachments || !m.attachments.length)) continue;
    inner.append(renderBubble(m, taskById, latestAgentMsgByTask));
  }

  if (app.sending) {
    inner.append(h("div", { class: "row agent" },
      h("div", { class: "bubble agent", style: { opacity: ".7" } },
        h("span", { class: "bubble-status" },
          h("span", { class: "pulse" }), "thinking…"))));
  }

  // scroll to bottom after render
  setTimeout(() => { body.scrollTop = body.scrollHeight; }, 0);
  return body;
}

function renderBubble(m, taskById, latestAgentMsgByTask) {
  const row = h("div", { class: "row " + m.role });
  if (m.role === "system") {
    row.append(h("div", { class: "bubble system" }, m.content));
    return row;
  }
  const bubble = h("div", { class: "bubble " + m.role });

  // user attachments shown above text
  if (m.role === "user" && m.attachments && m.attachments.length) {
    const grid = h("div", { class: "bubble-attachments" });
    for (const aid of m.attachments) {
      grid.append(h("img", { src: assetUrl(aid), alt: "",
        onclick: () => { app.lightbox = aid; render(); } }));
    }
    bubble.append(grid);
  }

  if (m.content) bubble.append(h("span", {}, m.content));

  // agent bubble action area — show image + buttons when this is the latest
  // agent bubble for a task currently waiting on the designer.
  if (m.role === "agent" && m.related_task_id && latestAgentMsgByTask[m.related_task_id] === m.message_id) {
    const task = taskById[m.related_task_id];
    if (task) {
      if (task.workflow_state === "waiting_human_review") {
        appendReviewPanel(bubble, m);
      } else if (task.workflow_state === "failed") {
        appendFailurePanel(bubble, m);
      } else if (ACTIVE_STATES.includes(task.workflow_state)) {
        bubble.append(h("div", { class: "bubble-status" },
          h("span", { class: "pulse" }), "still working…"));
      }
    }
  }
  row.append(bubble);
  return row;
}

function appendReviewPanel(bubble, agentMsg) {
  const runId = agentMsg.related_run_id;
  const assets = (app.detail.gallery || []).filter(a => a.run_id === runId);
  if (assets.length) {
    const grid = h("div", { class: "bubble-images" });
    let selected = assets[0].asset_id;
    const imgs = [];
    for (const a of assets) {
      const img = h("img", {
        src: assetUrl(a.asset_id), alt: "",
        class: (assets.length > 1 && a.asset_id === selected) ? "sel" : "",
      });
      img.addEventListener("click", e => {
        if (assets.length === 1) { app.lightbox = a.asset_id; render(); return; }
        selected = a.asset_id;
        for (const x of imgs) x.classList.remove("sel");
        img.classList.add("sel");
      });
      imgs.push(img); grid.append(img);
    }
    bubble.append(grid);

    const actions = h("div", { class: "bubble-actions" },
      h("button", { class: "b-btn approve",
        onclick: () => approveRun(runId, () => selected) }, "✓  Approve"),
      h("button", { class: "b-btn reject",
        onclick: () => { app.rejecting = { runId, reason: "" }; render(); } }, "✕  Reject"));
    bubble.append(actions);

    if (app.rejecting && app.rejecting.runId === runId) {
      const ta = h("textarea", {
        placeholder: "What's wrong with this result? (becomes the retry instruction)",
        oninput: e => app.rejecting.reason = e.target.value,
      }, app.rejecting.reason || "");
      const form = h("div", { class: "reject-form" }, ta,
        h("div", { class: "bubble-actions" },
          h("button", { class: "b-btn",
            onclick: () => { app.rejecting = null; render(); } }, "Cancel"),
          h("button", { class: "b-btn reject",
            onclick: () => rejectRun(runId, app.rejecting.reason) }, "Reject")));
      bubble.append(form);
      setTimeout(() => ta.focus(), 0);
    }
  }
}

function appendFailurePanel(bubble, agentMsg) {
  // the orchestrator's agent message already explained the failure; here we
  // just offer the designer an explicit retry-by-message hint.
  bubble.append(h("div", { class: "fail-card" },
    "This run failed. Send a new message to try again — describe the change you want."));
}

/* ========================== COMPOSER ===================================== */
function renderComposer() {
  const wrap = h("div", { class: "composer" });
  const inner = h("div", { class: "composer-inner" });
  wrap.append(inner);

  if (app.composer.files.length) {
    const row = h("div", { class: "attached-row" });
    app.composer.files.forEach((f, i) => {
      const chip = h("span", { class: "attached-chip" });
      const url = URL.createObjectURL(f);
      chip.append(
        h("img", { src: url, alt: "" }),
        h("span", {}, f.name.length > 22 ? f.name.slice(0,20) + "…" : f.name),
        h("span", { class: "x",
          onclick: () => { app.composer.files.splice(i, 1); render(); } }, "×"));
      row.append(chip);
    });
    inner.append(row);
  }

  const fileInput = h("input", {
    type: "file", accept: "image/*", multiple: "multiple",
    style: { display: "none" },
    onchange: e => {
      app.composer.files = app.composer.files.concat([...e.target.files]);
      render();
    },
  });

  const box = h("div", { class: "composer-box" });
  // drag-drop
  box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("dragover"); });
  box.addEventListener("dragleave", e => { box.classList.remove("dragover"); });
  box.addEventListener("drop", e => {
    e.preventDefault(); box.classList.remove("dragover");
    const files = [...(e.dataTransfer?.files || [])].filter(f => f.type.startsWith("image/"));
    if (files.length) { app.composer.files = app.composer.files.concat(files); render(); }
  });

  const textarea = h("textarea", {
    placeholder: "Tell me what you want, or react to the last result…",
    rows: "1",
    value: app.composer.text,
    oninput: e => {
      app.composer.text = e.target.value;
      autoSize(e.target);
    },
    onkeydown: e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    },
  });

  box.append(
    h("button", { class: "icon-btn", title: "Attach image",
      onclick: () => fileInput.click() }, "📎"),
    fileInput,
    textarea,
    h("button", {
      class: "send-btn", title: "Send (Enter)",
      disabled: app.sending || (!app.composer.text.trim() && !app.composer.files.length) ? "disabled" : null,
      onclick: send,
    }, "➤"));

  inner.append(box);
  inner.append(h("div", { class: "composer-help" },
    "Enter to send • Shift+Enter for newline • Drop an image to start Gate A"));

  setTimeout(() => { autoSize(textarea); textarea.focus(); }, 0);
  return wrap;
}

function autoSize(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.min(200, ta.scrollHeight) + "px";
}

/* ========================== ACTIONS ====================================== */
function startNewChat() {
  app.activeId = null;
  app.detail = null;
  app.composer = { text: "", files: [] };
  app.rejecting = null;
  navigate("/");
  // /  is parsed as home; we still render the composer because activeId being
  //   null is the new-chat sentinel.
  render();
}

async function send() {
  const text = app.composer.text.trim();
  const files = app.composer.files;
  if (!text && !files.length) return;
  if (app.sending) return;
  app.sending = true; app.rejecting = null; render();

  try {
    if (!app.activeId) {
      const conv = await API.post("/conversations", {});
      app.activeId = conv.conversation_id;
      navigate("/conv/" + conv.conversation_id);
      // ensure detail is set so render() doesn't bounce to the spinner state
      app.detail = { conversation: conv, messages: [], gallery: [], tasks: [] };
    }

    const fd = new FormData();
    if (text) fd.append("text", text);
    for (const f of files) fd.append("attachments", f, f.name);

    const result = await API.postForm("/conversations/" + app.activeId + "/messages", fd);

    app.composer = { text: "", files: [] };
    // patch detail with the two new messages (optimistic)
    if (result.user_message) app.detail.messages.push(result.user_message);
    if (result.agent_message) app.detail.messages.push(result.agent_message);
    // reload sidebar + detail fully — message endpoint may have started a task
    await Promise.all([loadConversation(app.activeId), loadList()]);
  } catch (e) {
    toast(e.message || "send failed", "err");
  } finally {
    app.sending = false;
    render();
  }
}

async function approveRun(runId, getSelected) {
  if (app.sending) return;
  app.sending = true; render();
  try {
    await API.postForm("/conversations/" + app.activeId + "/messages",
      _formWithAction({ type: "approve", run_id: runId, selected_asset_id: getSelected() }));
    await loadConversation(app.activeId);
    await loadList();
  } catch (e) { toast(e.message, "err"); }
  finally { app.sending = false; render(); }
}

async function rejectRun(runId, reason) {
  reason = (reason || "").trim();
  if (!reason) { toast("Add a reason first.", "err"); return; }
  if (app.sending) return;
  app.sending = true; render();
  try {
    await API.postForm("/conversations/" + app.activeId + "/messages",
      _formWithAction({ type: "reject", run_id: runId, reason }));
    app.rejecting = null;
    await loadConversation(app.activeId);
    await loadList();
  } catch (e) { toast(e.message, "err"); }
  finally { app.sending = false; render(); }
}

function _formWithAction(action) {
  const fd = new FormData();
  fd.append("action", JSON.stringify(action));
  return fd;
}

async function hideChat(cid) {
  try { await API.post("/conversations/" + cid + "/hide"); }
  catch (e) { toast(e.message, "err"); return; }
  if (cid === app.activeId) { app.activeId = null; app.detail = null; navigate("/"); }
  await loadList();
  if (app.showHidden) await loadHiddenList();
  render();
}
async function hideActive() {
  if (!app.activeId) return;
  if (!confirm("Hide this chat? It stays in the database; you can restore it later.")) return;
  await hideChat(app.activeId);
}
async function restoreChat(cid) {
  try { await API.post("/conversations/" + cid + "/restore"); }
  catch (e) { toast(e.message, "err"); return; }
  await Promise.all([loadList(), loadHiddenList()]);
  render();
}
async function renameActive() {
  if (!app.activeId) return;
  const current = app.detail?.conversation?.title || "";
  const next = prompt("Rename chat:", current);
  if (next === null) return;
  const title = next.trim();
  if (!title || title === current) return;
  try {
    await API.patch("/conversations/" + app.activeId, { title });
    await Promise.all([loadConversation(app.activeId), loadList()]);
  } catch (e) { toast(e.message, "err"); }
}

/* ========================== LOADING ====================================== */
async function loadList() {
  try { app.conversations = await API.get("/conversations"); }
  catch { app.conversations = []; }
}
async function loadHiddenList() {
  try {
    const all = await API.get("/conversations?include_hidden=true");
    app.hiddenConvs = all.filter(c => c.hidden_at);
  } catch { app.hiddenConvs = []; }
}
async function loadConversation(id) {
  try {
    app.detail = await API.get("/conversations/" + id);
  } catch (e) {
    app.detail = null;
    toast(e.message || "could not load chat", "err");
  }
}
async function refreshHealth() {
  try {
    const [health, workers] = await Promise.all([
      API.get("/health").catch(() => ({ ok: false })),
      API.get("/workers").catch(() => []),
    ]);
    app.health = health; app.workers = workers;
  } catch { app.health = { ok: false }; }
}

/* ========================== POLLING ====================================== */
function syncPolling() {
  stopPoll();
  const r = parseRoute();
  if (r.name === "conv" && app.detail) {
    const anyActive = (app.detail.tasks || []).some(t => ACTIVE_STATES.includes(t.workflow_state));
    if (anyActive) startPoll(async () => {
      if (document.hidden) return;
      await loadConversation(app.activeId);
      await loadList();
      render();
    }, 3500);
    else startPoll(async () => {
      if (document.hidden) return;
      await loadList();
      render();
    }, 12000);
  } else {
    startPoll(async () => {
      if (document.hidden) return;
      await loadList();
      render();
    }, 12000);
  }
}

/* ========================== RENDER ROOT ================================= */
async function onRouteChange() {
  const r = parseRoute();
  app.rejecting = null;
  if (r.name === "conv" && r.id !== app.activeId) {
    app.activeId = r.id;
    app.detail = null;
    render();
    await loadConversation(r.id);
  } else if (r.name === "home") {
    // home keeps composer ready for a new chat; clear detail
    if (app.activeId !== null) { app.activeId = null; app.detail = null; }
  }
  render();
}

function render() {
  const root = document.getElementById("root");
  clear(root);
  root.append(renderSidebar(), renderMain());
  if (app.lightbox) {
    const lb = h("div", { class: "lightbox", onclick: () => { app.lightbox = null; render(); } },
      h("img", { src: assetUrl(app.lightbox), alt: "" }));
    document.body.append(lb);
    // remove the previous lightbox node next render
    const lbs = document.querySelectorAll(".lightbox");
    for (let i = 0; i < lbs.length - 1; i++) lbs[i].remove();
  } else {
    document.querySelectorAll(".lightbox").forEach(n => n.remove());
  }
  syncPolling();
}

/* ============================== BOOT ===================================== */
(async function boot() {
  try { if (localStorage.getItem("cw_theme") === "light") document.body.classList.add("light"); } catch {}
  window.addEventListener("hashchange", onRouteChange);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncPolling(); });

  await refreshHealth();
  await loadList();

  const r = parseRoute();
  if (r.name === "conv") {
    app.activeId = r.id;
    await loadConversation(r.id);
  }
  render();

  // refresh health every 20s; sidebar status stays current without disturbing the thread.
  setInterval(async () => { await refreshHealth(); render(); }, 20000);
})();
</script>
</body>
</html>
