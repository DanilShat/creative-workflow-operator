<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Creative Workflow — Operator Console</title>
<style>
/* ============================ design system ============================ */
:root {
  --bg: #0d0e12; --bg-2: #14161d; --bg-3: #1b1e27; --bg-hover: #20242f;
  --border: #282b36; --border-soft: #20222c;
  --text: #e7e8ec; --text-dim: #969aa6; --text-faint: #6b6f7c;
  --accent: #6d8bff;
  --amber: #e5a13a; --blue: #5b9bd5; --green: #43b888; --red: #e0594f; --gray: #6b7280;
  --shadow: 0 6px 24px rgba(0,0,0,.35);
  --radius: 14px; --radius-sm: 9px;
}
body.light {
  --bg: #f4f5f7; --bg-2: #ffffff; --bg-3: #fbfbfc; --bg-hover: #eef0f3;
  --border: #e2e4e9; --border-soft: #ecedf1;
  --text: #1c1f27; --text-dim: #5d626e; --text-faint: #9097a3;
  --shadow: 0 6px 22px rgba(20,24,40,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
#root { display: flex; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

/* ============================ sidebar ============================ */
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--bg-2);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  padding: 18px 14px; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand .mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #9a6dff);
}
.brand .name { font-weight: 650; font-size: 14.5px; letter-spacing: .2px; }
.brand .sub { font-size: 11px; color: var(--text-faint); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  border-radius: var(--radius-sm); color: var(--text-dim); font-weight: 500;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--bg-3); color: var(--text); }
.nav-item.active .ic { color: var(--accent); }
.ic { width: 17px; text-align: center; opacity: .9; }
.nav-spacer { flex: 1; }
.sys-card {
  background: var(--bg-3); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 11px 12px; font-size: 12px;
}
.sys-row { display: flex; align-items: center; gap: 8px; color: var(--text-dim); }
.sys-row + .sys-row { margin-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--gray); }
.dot.green { background: var(--green); } .dot.red { background: var(--red); }
.dot.amber { background: var(--amber); }
.theme-btn {
  margin-top: 10px; width: 100%; background: transparent; color: var(--text-dim);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px; font-size: 12px;
}
.theme-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ============================ main ============================ */
.main { flex: 1; min-width: 0; }
.content { max-width: 1180px; margin: 0 auto; padding: 30px 36px 60px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
.page-title { font-size: 21px; font-weight: 650; letter-spacing: -.2px; }
.page-sub { color: var(--text-dim); margin-top: 3px; font-size: 13px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px;
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: var(--bg-3); color: var(--text); font-weight: 550; font-size: 13px;
  transition: background .12s, border-color .12s, transform .04s;
}
.btn:hover { background: var(--bg-hover); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #5d7cf5; }
.btn-green { background: var(--green); border-color: var(--green); color: #06281c; }
.btn-green:hover { filter: brightness(1.07); }
.btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(224,89,79,.12); }
.btn-sm { padding: 6px 11px; font-size: 12px; }

/* cards */
.card {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }

/* pills */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid transparent;
}
.pill .pdot { width: 6px; height: 6px; border-radius: 50%; }
.pill.gray  { background: rgba(107,114,128,.14); color: #aab; border-color: rgba(107,114,128,.3); }
.pill.amber { background: rgba(229,161,58,.13); color: var(--amber); border-color: rgba(229,161,58,.32); }
.pill.blue  { background: rgba(91,155,213,.13); color: var(--blue); border-color: rgba(91,155,213,.32); }
.pill.green { background: rgba(67,184,136,.13); color: var(--green); border-color: rgba(67,184,136,.32); }
.pill.red   { background: rgba(224,89,79,.13); color: var(--red); border-color: rgba(224,89,79,.34); }
.pill.gray .pdot{background:var(--gray)} .pill.amber .pdot{background:var(--amber)}
.pill.blue .pdot{background:var(--blue)} .pill.green .pdot{background:var(--green)}
.pill.red .pdot{background:var(--red)}

/* inputs */
label.fld { display: block; margin-bottom: 14px; }
.fld-label { font-size: 12.5px; font-weight: 550; color: var(--text-dim); margin-bottom: 6px; }
.input, .textarea, select.input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 13.5px; font-family: inherit;
}
.input:focus, .textarea:focus, select.input:focus { outline: none; border-color: var(--accent); }
.textarea { resize: vertical; min-height: 90px; line-height: 1.55; }

/* gallery grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.tcard {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: transform .1s, border-color .12s; cursor: pointer;
}
.tcard:hover { transform: translateY(-2px); border-color: #3a3e4c; }
.thumb { aspect-ratio: 4/5; width: 100%; object-fit: cover; display: block; background: var(--bg-3); }
.thumb-ph { aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,.5); font-size: 26px; }
.tcard-body { padding: 12px 13px 13px; }
.tcard-title { font-weight: 600; font-size: 13.5px; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tcard-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
.tcard-time { font-size: 11px; color: var(--text-faint); }

/* filter chips */
.chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
.chip {
  padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 550;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim);
}
.chip:hover { color: var(--text); }
.chip.on { background: var(--bg-3); color: var(--text); border-color: #3c4150; }

/* pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.stage .conn { position: absolute; top: 21px; height: 2px; background: var(--border); z-index: 0; }
.stage .conn.left { left: 0; right: 50%; } .stage .conn.right { left: 50%; right: 0; }
.stage .conn.fill { background: var(--green); }
.stage:first-child .conn.left, .stage:last-child .conn.right { display: none; }
.node {
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 18px; z-index: 1;
  border: 2px solid var(--border); background: var(--bg-3); color: var(--text-faint);
}
.node.done { border-color: var(--green); background: rgba(67,184,136,.16); color: var(--green); }
.node.running { border-color: var(--amber); background: rgba(229,161,58,.16); color: var(--amber);
  animation: pulse 1.6s ease-in-out infinite; }
.node.failed { border-color: var(--red); background: rgba(224,89,79,.16); color: var(--red); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(229,161,58,.4)} 50%{box-shadow:0 0 0 7px rgba(229,161,58,0)} }
.stage-name { font-weight: 600; font-size: 12.5px; margin-top: 9px; }
.stage-sub { font-size: 11px; color: var(--text-faint); margin-top: 2px; max-width: 150px; }

/* timeline */
.tl-item { display: flex; gap: 11px; padding: 7px 0; }
.tl-item:not(:last-child) { border-bottom: 1px solid var(--border-soft); }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex-shrink: 0; }
.tl-body { flex: 1; min-width: 0; }
.tl-text { font-size: 13px; }
.tl-time { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

/* banners */
.banner { padding: 13px 15px; border-radius: var(--radius-sm); font-size: 13px; }
.banner.red { background: rgba(224,89,79,.1); border: 1px solid rgba(224,89,79,.3); color: #f0a39c; }
.banner.amber { background: rgba(229,161,58,.1); border: 1px solid rgba(229,161,58,.3); color: #e8c489; }
.banner.blue { background: rgba(91,155,213,.1); border: 1px solid rgba(91,155,213,.3); color: #a9cce8; }

/* misc */
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); font-size: 12px; }
.imgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 11px; }
.imgrid img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: var(--radius-sm);
  border: 2px solid transparent; cursor: pointer; background: var(--bg-3); }
.imgrid img.sel { border-color: var(--accent); }
.empty { text-align: center; padding: 70px 20px; color: var(--text-dim); }
.empty .big { font-size: 34px; margin-bottom: 12px; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 50px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.prompt-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--text-dim); }
.backlink { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; display: inline-block; }
.backlink:hover { color: var(--text); }

/* chat */
.chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 60px); max-width: 760px; margin: 0 auto; }
.chat-thread { flex: 1; overflow-y: auto; padding: 26px 0; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 75%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--bg-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.sys { align-self: center; background: transparent; color: var(--text-faint); font-size: 12px; }
.chat-input { display: flex; gap: 9px; padding: 14px 0 18px; border-top: 1px solid var(--border); }

/* toasts */
#toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 99; }
.toast { padding: 11px 15px; border-radius: var(--radius-sm); font-size: 13px; box-shadow: var(--shadow);
  background: var(--bg-3); border: 1px solid var(--border); animation: rise .2s ease; max-width: 340px; }
.toast.err { border-color: rgba(224,89,79,.45); color: #f0a39c; }
.toast.ok { border-color: rgba(67,184,136,.45); color: #8fdab9; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script>
"use strict";
/* ======================================================================
   Creative Workflow — Operator Console
   Single-file vanilla SPA, served same-origin by the FastAPI operator.
   ====================================================================== */

/* ----------------------------- helpers ------------------------------- */
function h(tag, attrs) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style" && typeof v === "object") Object.assign(e.style, v);
    else if (k.slice(0,2) === "on" && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (let i = 2; i < arguments.length; i++) {
    const kids = Array.isArray(arguments[i]) ? arguments[i] : [arguments[i]];
    for (const kid of kids) {
      if (kid === null || kid === undefined || kid === false) continue;
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  return e;
}
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function navigate(hash) { location.hash = hash; }

function timeAgo(iso) {
  if (!iso) return "";
  const d = new Date(iso), s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  if (s < 604800) return Math.floor(s/86400) + "d ago";
  return d.toLocaleDateString();
}
function assetUrl(id) { return "/api/v1/assets/" + id + "/download"; }
function hue(str) { let n = 0; for (const c of String(str)) n = (n*31 + c.charCodeAt(0)) % 360; return n; }

function toast(msg, kind) {
  const t = h("div", { class: "toast " + (kind || "") }, msg);
  document.getElementById("toasts").append(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 4200);
  setTimeout(() => t.remove(), 4600);
}

/* ------------------------------- API --------------------------------- */
async function apiErr(r) {
  let detail;
  try { detail = await r.json(); } catch { detail = null; }
  let m = r.statusText;
  if (detail) {
    if (detail.detail) m = detail.detail.message || (typeof detail.detail === "string" ? detail.detail : m);
    else if (detail.error) m = detail.error.message || m;
  }
  const e = new Error(typeof m === "string" ? m : JSON.stringify(m));
  e.status = r.status;
  return e;
}
const API = {
  async get(p)  { const r = await fetch("/api/v1" + p); if (!r.ok) throw await apiErr(r); return r.json(); },
  async post(p, body) {
    const r = await fetch("/api/v1" + p, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw await apiErr(r);
    return r.json();
  },
  async postForm(p, fd) {
    const r = await fetch("/api/v1" + p, { method: "POST", body: fd });
    if (!r.ok) throw await apiErr(r);
    return r.json();
  },
};
async function sha256Hex(buf) {
  if (!(window.crypto && crypto.subtle)) {
    throw new Error("Uploads need a secure context — open the console at http://127.0.0.1:8000/app/ on the server machine.");
  }
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------------------------- workflow ------------------------------- */
const GEMINI_ACTION = "gemini_build_prompt_from_brief_and_refs";
const FREEPIK_ACTION = "freepik_generate_image_from_prompt";
const ACTIVE_STATES = ["waiting_worker", "running_worker_job", "retry_requested"];
const STATE_META = {
  draft:                { label: "Draft",          color: "gray"  },
  waiting_worker:       { label: "In progress",    color: "amber" },
  running_worker_job:   { label: "Working",        color: "amber" },
  retry_requested:      { label: "Retrying",       color: "amber" },
  waiting_human_review: { label: "Needs review",   color: "blue"  },
  human_approved:       { label: "Approved",       color: "green" },
  human_rejected:       { label: "Rejected",       color: "red"   },
  agent_replied:        { label: "Agent replied",  color: "blue"  },
  failed:               { label: "Failed",         color: "red"   },
};
function stateMeta(s) { return STATE_META[s] || { label: s || "unknown", color: "gray" }; }
function pill(state) {
  const m = stateMeta(state);
  return h("span", { class: "pill " + m.color }, h("span", { class: "pdot" }), m.label);
}
const TERMINAL_JOB = ["completed", "failed_fatal", "failed_retryable", "cancelled", "orphaned"];

function stageStatus(jobs) {
  if (!jobs.length) return { s: "pending", sub: "Not started" };
  const sorted = [...jobs].sort((a,b) => String(a.created_at).localeCompare(String(b.created_at)));
  if (sorted.some(j => j.state === "completed")) return { s: "done", sub: "Completed" };
  const last = sorted[sorted.length - 1];
  if (["failed_fatal","failed_retryable","orphaned","cancelled"].includes(last.state)) {
    return { s: "failed", sub: (last.failure_type || last.state || "failed").replace(/_/g," ") };
  }
  return { s: "running", sub: (last.state || "running").replace(/_/g," ") };
}
function humanizeEvent(ev) {
  const p = ev.payload_json || {};
  switch (ev.event_type) {
    case "task_created":        return "Task created";
    case "gate_a_started":      return "Gate A started — " + (p.variant_count || 1) + " variant(s)";
    case "job_claimed":         return "Worker claimed a job";
    case "job_progress":        return (p.step || "step") + ": " + (p.message || p.state || "");
    case "freepik_job_created": return "Gemini prompt ready — Freepik image job created";
    case "job_completed":       return "Job completed";
    case "waiting_human_review":return "Image ready for your review";
    case "job_failed":          return "Job failed — " + (p.failure_type || "") + " " + (p.message || "");
    case "job_orphaned":        return "Job lease expired (orphaned)";
    case "job_retry_enqueued":  return "Retry attempt enqueued";
    case "human_approved":      return "You approved the result";
    case "human_rejected":      return "You rejected the result" + (p.reason ? " — " + p.reason : "");
    case "retry_requested":     return "Retry requested" + (p.repair_instruction ? " — " + p.repair_instruction : "");
    case "agent_chat_requested":return "Agent chat sent to worker";
    case "agent_chat_completed":return "Agent replied";
    default:                    return (ev.event_type || "event").replace(/_/g, " ");
  }
}

/* ---------------------------- app state ------------------------------ */
const app = {
  health: null, workers: [],
  galleryFilter: "all",
  forms: {},          // transient form values, survive re-renders
  chat: [],
  detailSig: null,    // change-detection signature for the detail screen
};
let pollTimer = null;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function startPoll(fn, ms) { stopPoll(); pollTimer = setInterval(fn, ms); }

/* ------------------------------ shell -------------------------------- */
function navItem(icon, label, hash, route) {
  return h("a", { class: "nav-item" + (route === hash ? " active" : ""), href: "#" + hash },
    h("span", { class: "ic" }, icon), label);
}
function renderShell(route) {
  const onlineWorkers = app.workers.filter(w => w.status !== "offline").length;
  const healthOk = app.health && app.health.ok;
  return h("aside", { class: "sidebar" },
    h("div", { class: "brand" },
      h("div", { class: "mark" }),
      h("div", {},
        h("div", { class: "name" }, "Creative Workflow"),
        h("div", { class: "sub" }, "Operator Console"))),
    h("nav", { class: "nav" },
      navItem("▦", "Gallery", "/", route),
      navItem("✚", "New brief", "/new", route),
      navItem("💬", "Chat", "/chat", route),
      navItem("⚙", "System", "/system", route)),
    h("div", { class: "nav-spacer" }),
    h("div", { class: "sys-card" },
      h("div", { class: "sys-row" },
        h("span", { class: "dot " + (healthOk ? "green" : "red") }),
        healthOk ? "Operator online" : "Operator unreachable"),
      h("div", { class: "sys-row" },
        h("span", { class: "dot " + (onlineWorkers ? "green" : "amber") }),
        onlineWorkers + " worker" + (onlineWorkers === 1 ? "" : "s") + " online")),
    h("button", { class: "theme-btn", onclick: toggleTheme }, "Toggle theme"));
}
function toggleTheme() {
  document.body.classList.toggle("light");
  try { localStorage.setItem("cw_theme", document.body.classList.contains("light") ? "light" : "dark"); } catch {}
}

/* ============================ SCREENS ================================ */

/* ------------------------------ gallery ------------------------------ */
async function screenGallery(content) {
  content.append(h("div", { class: "spinner" }));
  let tasks;
  try { tasks = await API.get("/tasks"); }
  catch (e) { clear(content); content.append(errorState(e, () => render())); return; }

  async function refresh() {
    try {
      const fresh = await API.get("/tasks");
      if (location.hash.replace(/^#/, "") === "/" || location.hash === "") { tasks = fresh; draw(); }

/* ----------------------------- task detail --------------------------- */
async function screenTask(content, taskId) {
  content.append(h("div", { class: "spinner" }));
  let data;
  async function load() {
    const [summary, history] = await Promise.all([
      API.get("/tasks/" + taskId), API.get("/tasks/" + taskId + "/history"),
    ]);
    return { summary, history };
  }
  try { data = await load(); }
  catch (e) { clear(content); content.append(errorState(e, () => render())); return; }

  function signature(d) {
    const jobs = (d.history.jobs || []).map(j => j.job_id + j.state).join(",");
    return [d.summary.workflow_state, jobs, (d.history.assets||[]).length,
      (d.history.reviews||[]).length, (d.history.workflow_events||[]).length].join("|");
  }
  app.detailSig = signature(data);

  async function refresh() {
    if (location.hash.indexOf("/task/" + taskId) === -1) return;
    try {
      const fresh = await load();
      const sig = signature(fresh);
      if (sig !== app.detailSig) { app.detailSig = sig; data = fresh; draw(); }
    } catch {}
  }
  function syncPoll() {
    if (ACTIVE_STATES.includes(data.summary.workflow_state)) startPoll(refresh, 4000);
    else if (data.summary.workflow_state === "waiting_human_review") startPoll(refresh, 9000);
    else stopPoll();
  }

  function draw() {
    clear(content);
    const { summary, history } = data;
    content.append(h("a", { class: "backlink", href: "#/" }, "← Gallery"));
    content.append(h("div", { class: "page-head" },
      h("div", {},
        h("div", { class: "page-title" }, summary.title || "Untitled"),
        h("div", { class: "page-sub" }, (summary.requested_output_type || "").replace(/_/g," "))),
      pill(summary.workflow_state)));

    // brief
    content.append(h("div", { class: "card" },
      h("div", { class: "card-title" }, "Brief"),
      h("div", { class: "muted", style: { whiteSpace: "pre-wrap" } }, summary.brief_text || "—")));

    // pipeline
    content.append(pipelineCard(summary, history));

    // state-specific action panel
    const panel = actionPanel(data, draw, syncPoll);
    if (panel) content.append(panel);

    // prompt
    const prompts = (history.prompts || []).filter(p => p.prompt_text);
    if (prompts.length) {
      const latest = prompts[prompts.length - 1];
      content.append(h("div", { class: "card" },
        h("div", { class: "card-title" }, "Generated prompt"),
        h("div", { class: "prompt-box" }, latest.prompt_text)));
    }

    // generated images
    const generated = (history.assets || []).filter(a => a.asset_class === "generated");
    if (generated.length) {
      content.append(h("div", { class: "card" },
        h("div", { class: "card-title" }, "Generated images"),
        h("div", { class: "imgrid" },
          generated.map(a => h("img", { src: assetUrl(a.asset_id), loading: "lazy", alt: "",
            onclick: () => window.open(assetUrl(a.asset_id), "_blank") })))));
    }

    // timeline
    const events = [...(history.workflow_events || [])].reverse();
    if (events.length) {
      const tl = h("div", {});
      for (const ev of events.slice(0, 40)) {
        tl.append(h("div", { class: "tl-item" },
          h("div", { class: "tl-dot" }),
          h("div", { class: "tl-body" },
            h("div", { class: "tl-text" }, humanizeEvent(ev)),
            h("div", { class: "tl-time" }, timeAgo(ev.created_at)))));
      }
      content.append(h("div", { class: "card" },
        h("div", { class: "card-title" }, "Activity"), tl));
    }
    syncPoll();
  }
  draw();
}

function pipelineCard(summary, history) {
  const gem = stageStatus((history.jobs || []).filter(j => j.action_name === GEMINI_ACTION));
  const fre = stageStatus((history.jobs || []).filter(j => j.action_name === FREEPIK_ACTION));
  let rev = { s: "pending", sub: "Waiting" };
  if (summary.workflow_state === "waiting_human_review") rev = { s: "running", sub: "Your review" };
  else if (summary.workflow_state === "human_approved") rev = { s: "done", sub: "Approved" };
  else if (summary.workflow_state === "human_rejected") rev = { s: "failed", sub: "Rejected" };
  const stages = [
    { name: "Gemini prompt", icon: "✦", st: gem },
    { name: "Freepik image", icon: "❖", st: fre },
    { name: "Review", icon: "✓", st: rev },
  ];
  const strip = h("div", { class: "pipeline" });
  stages.forEach((stage, i) => {
    const prevDone = i > 0 && stages[i-1].st.s === "done";
    const meDone = stage.st.s === "done";
    strip.append(h("div", { class: "stage" },
      h("div", { class: "conn left" + (prevDone ? " fill" : "") }),
      h("div", { class: "conn right" + (meDone ? " fill" : "") }),
      h("div", { class: "node " + (stage.st.s === "pending" ? "" : stage.st.s) },
        stage.st.s === "done" ? "✓" : stage.st.s === "failed" ? "!" : stage.icon),
      h("div", { class: "stage-name" }, stage.name),
      h("div", { class: "stage-sub" }, stage.st.sub)));
  });
  return h("div", { class: "card" }, h("div", { class: "card-title" }, "Pipeline"), strip);
}

function actionPanel(data, draw, syncPoll) {
  const { summary, history } = data;
  const state = summary.workflow_state;
  const f = app.forms;

  if (state === "draft") {
    const refs = (history.assets || []).filter(a => a.asset_class === "reference");
    const card = h("div", { class: "card" }, h("div", { class: "card-title" }, "Start Gate A"));
    card.append(h("div", { class: "muted", style: { marginBottom: "12px" } },
      refs.length + " reference image" + (refs.length === 1 ? "" : "s") + " attached."));
    if (!refs.length) {
      card.append(h("div", { class: "banner amber" },
        "Gate A needs at least one reference image. Add one below to start."));
      card.append(addReferenceControl(summary.task_id, draw));
      return card;
    }
    card.append(field("Operator note (optional)", h("textarea", {
      class: "textarea", placeholder: "Extra direction for the prompt…",
      oninput: e => f.note = e.target.value }, f.note || "")));
    card.append(field("Variants", h("input", {
      class: "input", type: "number", min: "1", max: "20", value: f.variants || 1,
      oninput: e => f.variants = e.target.value })));
    let busy = false;
    const btn = h("button", { class: "btn btn-primary", onclick: start }, "▶  Start Gate A");
    card.append(h("div", { class: "row" }, btn, addReferenceControl(summary.task_id, draw)));
    async function start() {
      if (busy) return; busy = true; btn.textContent = "Starting…"; btn.disabled = true;
      try {
        await API.post("/tasks/" + summary.task_id + "/start-gate-a", {
          task_id: summary.task_id,
          operator_note: (f.note || "").trim() || null,
          variant_count: Math.max(1, Math.min(20, parseInt(f.variants || 1, 10) || 1)),
        });
        f.note = ""; f.variants = 1;
        toast("Gate A started", "ok");
        render();
      } catch (e) { busy = false; btn.textContent = "▶  Start Gate A"; btn.disabled = false; toast(e.message, "err"); }
    }
    return card;
  }

  if (ACTIVE_STATES.includes(state)) {
    const progress = [...(history.workflow_events || [])].reverse()
      .find(ev => ev.event_type === "job_progress");
    const msg = progress ? humanizeEvent(progress) : "Waiting for a worker to pick this up…";
    return h("div", { class: "card" },
      h("div", { class: "card-title" }, "In progress"),
      h("div", { class: "banner amber" }, "⏳  " + msg),
      h("div", { class: "faint", style: { marginTop: "10px" } }, "This view refreshes automatically."));
  }

  if (state === "waiting_human_review") {
    return reviewPanel(data, draw);
  }

  if (state === "human_rejected") {
    return retryPanel(data, draw);
  }

  if (state === "human_approved") {
    return h("div", { class: "card" },
      h("div", { class: "card-title" }, "Result"),
      h("div", { class: "banner blue" }, "✓  This task is approved and complete."));
  }

  if (state === "failed") {
    const failedJob = [...(history.jobs || [])].reverse()
      .find(j => ["failed_fatal","failed_retryable","orphaned"].includes(j.state));
    const card = h("div", { class: "card" }, h("div", { class: "card-title" }, "Failed"));
    card.append(h("div", { class: "banner red" },
      "✕  " + (failedJob
        ? ((failedJob.failure_type || "error") + " — " + (failedJob.failure_message || "no detail"))
        : "This task failed.")));
    let busy = false;
    const btn = h("button", { class: "btn btn-primary", style: { marginTop: "12px" }, onclick: again },
      "↻  Run Gate A again");
    card.append(btn);
    async function again() {
      if (busy) return; busy = true; btn.disabled = true; btn.textContent = "Starting…";
      try {
        await API.post("/tasks/" + summary.task_id + "/start-gate-a",
          { task_id: summary.task_id, operator_note: null, variant_count: 1 });
        toast("New Gate A run started", "ok"); render();
      } catch (e) { busy = false; btn.disabled = false; btn.textContent = "↻  Run Gate A again"; toast(e.message, "err"); }
    }
    return card;
  }
  return null;
}

function addReferenceControl(taskId, draw) {

        const meta = { original_filename: file.name, content_type: file.type || "application/octet-stream",
          size_bytes: file.size, sha256: await sha256Hex(buf), source_service: "manual" };
        const fd = new FormData();
        fd.append("file", new Blob([buf], { type: meta.content_type }), file.name);
        fd.append("metadata", JSON.stringify(meta));
        await API.postForm("/tasks/" + taskId + "/references", fd);
        toast("Reference added", "ok");

function reviewPanel(data, draw) {
  const { summary, history } = data;
  const runId = summary.latest_run_id;
  const generated = (history.assets || []).filter(a =>
    a.asset_class === "generated" && (!runId || a.run_id === runId));
  const pool = generated.length ? generated : (history.assets || []).filter(a => a.asset_class === "generated");
  const f = app.forms;
  if (!f.selectedAsset || !pool.some(a => a.asset_id === f.selectedAsset)) {
    f.selectedAsset = pool.length ? pool[0].asset_id : null;
  }
  const card = h("div", { class: "card" }, h("div", { class: "card-title" }, "Your review"));
  if (!pool.length) {
    card.append(h("div", { class: "banner amber" }, "No generated image found for this run yet."));
    return card;
  }
  card.append(h("div", { class: "muted", style: { marginBottom: "10px" } },
    pool.length > 1 ? "Pick the variant you want, then approve — or reject with a reason." :
    "Approve this result, or reject it with a reason."));
  const grid = h("div", { class: "imgrid" });
  for (const a of pool) {
    grid.append(h("img", {
      src: assetUrl(a.asset_id), alt: "", loading: "lazy",
      class: f.selectedAsset === a.asset_id ? "sel" : "",
      onclick: () => { f.selectedAsset = a.asset_id; draw(); } }));
  }
  card.append(grid);
  card.append(field("Reason (required to reject)", h("textarea", {
    class: "textarea", style: { marginTop: "12px" }, placeholder: "What is wrong with this result?",
    oninput: e => f.rejectReason = e.target.value }, f.rejectReason || "")));

  let busy = false;
  const approveBtn = h("button", { class: "btn btn-green", onclick: () => decide("approved") }, "✓  Approve");
  const rejectBtn = h("button", { class: "btn btn-danger", onclick: () => decide("rejected") }, "✕  Reject");
  card.append(h("div", { class: "row" }, approveBtn, rejectBtn));

  async function decide(decision) {
    if (busy) return;
    if (decision === "rejected" && !(f.rejectReason || "").trim()) {
      toast("Add a reason before rejecting", "err"); return;
    }
    busy = true; approveBtn.disabled = rejectBtn.disabled = true;
    try {
      await API.post("/tasks/" + summary.task_id + "/reviews", {
        run_id: runId, decision,
        selected_asset_id: decision === "approved" ? f.selectedAsset : null,
        reason: (f.rejectReason || "").trim() || null,
      });
      f.rejectReason = "";
      toast(decision === "approved" ? "Approved" : "Rejected", "ok");
      render();
    } catch (e) { busy = false; approveBtn.disabled = rejectBtn.disabled = false; toast(e.message, "err"); }
  }
  return card;
}

function retryPanel(data, draw) {
  const { summary, history } = data;
  const rejected = [...(history.reviews || [])].reverse().find(r => r.decision === "rejected");
  const f = app.forms;
  const card = h("div", { class: "card" }, h("div", { class: "card-title" }, "Rejected — retry"));
  if (rejected && rejected.reason) {
    card.append(h("div", { class: "banner red", style: { marginBottom: "12px" } },
      "Your reason: " + rejected.reason));
  }
  if (!rejected) {
    card.append(h("div", { class: "banner amber" }, "No rejected review found to retry from."));
    return card;
  }
  card.append(field("How should the retry fix it?", h("textarea", {
    class: "textarea", placeholder: "Describe the change you want in the next attempt…",
    oninput: e => f.retryInstruction = e.target.value }, f.retryInstruction || "")));
  let busy = false;
  const btn = h("button", { class: "btn btn-primary", onclick: doRetry }, "↻  Retry Gate A");
  card.append(btn);
  async function doRetry() {
    if (busy) return;
    if (!(f.retryInstruction || "").trim()) { toast("Describe what to fix first", "err"); return; }
    busy = true; btn.disabled = true; btn.textContent = "Starting retry…";
    try {
      await API.post("/tasks/" + summary.task_id + "/retry", {
        source_run_id: rejected.run_id, review_id: rejected.review_id,
        repair_instruction: f.retryInstruction.trim(),
      });
      f.retryInstruction = "";
      toast("Retry started", "ok");
      render();
    } catch (e) { busy = false; btn.disabled = false; btn.textContent = "↻  Retry Gate A"; toast(e.message, "err"); }
  }
  return card;
}

/* -------------------------------- chat ------------------------------- */
function screenChat(content) {
  const f = app.forms;
  function draw() {
    clear(content);
    const thread = h("div", { class: "chat-thread" });
    if (!app.chat.length) {
      thread.append(h("div", { class: "empty" },
        h("div", { class: "big" }, "💬"),
        h("div", {}, "Ask the local agent anything about your tasks.")));
    }
    for (const m of app.chat) {
      if (m.role === "system") thread.append(h("div", { class: "msg sys" }, m.text));
      else thread.append(h("div", { class: "msg " + (m.role === "user" ? "user" : "bot") }, m.text));
    }
    const input = h("textarea", { class: "textarea", style: { minHeight: "44px" },
      placeholder: "Message the agent…  (Enter to send)", value: f.chatInput || "",
      oninput: e => f.chatInput = e.target.value,
      onkeydown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } } });
    content.append(h("div", { class: "chat-wrap" }, thread,
      h("div", { class: "chat-input" }, input,
        h("button", { class: "btn btn-primary", onclick: send }, "Send"))));
    thread.scrollTop = thread.scrollHeight;
    setTimeout(() => input.focus(), 0);
  }
  async function send() {
    const text = (f.chatInput || "").trim();
    if (!text) return;
    app.chat.push({ role: "user", text });
    f.chatInput = "";
    draw();
    try {
      const res = await API.post("/tasks/agent-chat", { message: text });
      if (res.reply && res.reply.text) {
        app.chat.push({ role: "bot", text: res.reply.text });
      } else if (res.job_id) {
        app.chat.push({ role: "system", text: "Sent to a worker agent — follow it in the task view." });
        app.chat.push({ role: "bot", text: "Working on it on the worker. Open task " + res.task_id + " to see the reply." });
      } else {
        app.chat.push({ role: "bot", text: "(no reply returned)" });
      }
    } catch (e) {
      app.chat.push({ role: "system", text: "Failed: " + e.message });
    }
    draw();
  }
  draw();
}

/* ------------------------------- system ------------------------------ */
async function screenSystem(content) {
  async function draw() {
    let health, workers;
    try {
      [health, workers] = await Promise.all([API.get("/health"), API.get("/workers")]);
      app.health = health; app.workers = workers;
    } catch (e) {
      app.health = { ok: false };
      clear(content); content.append(errorState(e, draw)); return;
    }
    clear(content);
    content.append(h("div", { class: "page-head" },
      h("div", {}, h("div", { class: "page-title" }, "System"),
        h("div", { class: "page-sub" }, "Operator server and connected workers."))));

    content.append(h("div", { class: "card" },
      h("div", { class: "card-title" }, "Operator"),
      h("div", { class: "sys-row", style: { fontSize: "13px" } },
        h("span", { class: "dot " + (health.ok ? "green" : "red") }),
        health.ok ? "Online — database reachable" : "Unreachable"),
      health.ok && h("div", { class: "faint", style: { marginTop: "8px" } },
        health.server_public_base_url || "")));

    const wcard = h("div", { class: "card" }, h("div", { class: "card-title" },
      "Workers (" + workers.length + ")"));
    if (!workers.length) {
      wcard.append(h("div", { class: "muted" }, "No workers have registered yet."));
    } else {
      for (const w of workers) {
        const stale = w.last_heartbeat_at &&
          (Date.now() - new Date(w.last_heartbeat_at).getTime()) > 60000;
        const color = stale || w.status === "offline" ? "red" : (w.active_job_id ? "amber" : "green");
        wcard.append(h("div", { class: "between", style: { padding: "9px 0",
          borderBottom: "1px solid var(--border-soft)" } },
          h("div", { class: "row" },
            h("span", { class: "dot " + color }),
            h("div", {},
              h("div", { style: { fontWeight: "600" } }, w.display_name || w.worker_id),
              h("div", { class: "faint" }, (w.capabilities || []).join(", ") || "no capabilities"))),
          h("div", { style: { textAlign: "right" } },
            h("div", { style: { fontSize: "12px" } }, stale ? "offline" : w.status),
            h("div", { class: "faint" },
              w.active_job_id ? "job " + w.active_job_id : "heartbeat " + timeAgo(w.last_heartbeat_at)))));
      }
    }
    content.append(wcard);
  }
  content.append(h("div", { class: "spinner" }));
  await draw();
  startPoll(draw, 15000);
}

/* ----------------------------- error state --------------------------- */
function errorState(e, retry) {
  const offline = !e.status;
  return h("div", { class: "empty" },
    h("div", { class: "big" }, offline ? "🔌" : "⚠"),
    h("div", { style: { fontWeight: "600", marginBottom: "4px" } },
      offline ? "Can't reach the operator" : "Something went wrong"),
    h("div", { class: "muted" }, offline
      ? "Is the server running?  Start it with the operator CLI, then retry."
      : e.message),
    h("div", { style: { marginTop: "16px" } },
      h("button", { class: "btn btn-primary", onclick: retry }, "Retry")));
}

/* ------------------------------ router ------------------------------- */
async function refreshShellData() {
  try {
    const [health, workers] = await Promise.all([
      API.get("/health").catch(() => ({ ok: false })),
      API.get("/workers").catch(() => []),
    ]);
    app.health = health; app.workers = workers;
  } catch { app.health = { ok: false }; }
}
function parseRoute() {
  const raw = (location.hash || "#/").replace(/^#/, "");
  if (raw.startsWith("/task/")) return { name: "task", id: raw.slice(6) };
  if (raw === "/new") return { name: "new" };
  if (raw === "/chat") return { name: "chat" };
  if (raw === "/system") return { name: "system" };
  return { name: "gallery" };
}
async function render() {
  stopPoll();
  const route = parseRoute();
  const routeHash = route.name === "task" ? "/task/" + route.id
    : route.name === "gallery" ? "/" : "/" + route.name;
  const root = document.getElementById("root");
  clear(root);
  const main = h("main", { class: "main" });
  const content = h("div", { class: "content" });
  main.append(content);
  root.append(renderShell(routeHash), main);

  if (route.name === "gallery") await screenGallery(content);
  else if (route.name === "new") screenNew(content);
  else if (route.name === "task") await screenTask(content, route.id);
  else if (route.name === "chat") screenChat(content);
  else if (route.name === "system") await screenSystem(content);
}

/* ------------------------------- boot -------------------------------- */
(function boot() {
  try { if (localStorage.getItem("cw_theme") === "light") document.body.classList.add("light"); } catch {}
  window.addEventListener("hashchange", render);
  refreshShellData().then(render);
  // keep the sidebar status fresh without disturbing the active screen
  setInterval(() => { refreshShellData().then(() => {
    const r = parseRoute();
    if (r.name !== "system") {
      const sb = document.querySelector(".sidebar");
      if (sb) {
        const routeHash = r.name === "task" ? "/task/" + r.id : r.name === "gallery" ? "/" : "/" + r.name;
        sb.replaceWith(renderShell(routeHash));
      }
    }
  }); }, 20000);
})();
</script>
</body>
</html>
