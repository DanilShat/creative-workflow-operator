name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: operator
      - uses: actions/checkout@v4
        with:
          repository: DanilShat/creative-workflow-worker
          path: creative_workflow_worker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: operator
        run: python -m pip install -e ".[test]"
      - name: Test
        working-directory: operator
        env:
          CREATIVE_WORKFLOW_WORKER_REPO: ${{ github.workspace }}\creative_workflow_worker
        run: python -m pytest tests -q
