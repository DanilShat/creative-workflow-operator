[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-workflow-operator"
version = "0.1.0"
description = "Operator control plane for the creative workflow automation system."
requires-python = ">=3.11"
# Pins use compatible-release (~=) at the version actually installed and tested,
# so a fresh install reproduces a known-good environment instead of drifting.
dependencies = [
  "alembic~=1.13.1",
  "fastapi~=0.136.1",
  "httpx~=0.27.2",
  "psycopg[binary]~=3.3.4",
  "pydantic~=2.13.4",
  "python-multipart~=0.0.20",
  "sqlalchemy~=2.0.27",
  "streamlit~=1.57.0",
  "typer~=0.25.1",
  "uvicorn[standard]~=0.37.0",
]

[project.optional-dependencies]
test = [
  "pytest~=9.0.3",
  "pytest-cov~=7.0.0",
]

[project.scripts]
server = "creative_workflow.server.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
