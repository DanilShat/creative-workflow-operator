[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-workflow-operator"
version = "0.1.0"
description = "Operator control plane for the creative workflow automation system."
requires-python = ">=3.11"
dependencies = [
  "alembic~=1.13.0",
  "fastapi>=0.120,<1.0",
  "httpx~=0.27.0",
  "psycopg[binary]~=3.1.0",
  "pydantic~=2.7.0",
  "python-multipart~=0.0.9",
  "sqlalchemy~=2.0.0",
  "streamlit~=1.35.0",
  "typer~=0.12.0",
  "uvicorn[standard]~=0.30.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
server = "creative_workflow.server.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
